<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Seçimi</title>
  <link rel="stylesheet" href="./CSS/styles0.css" />
</head>
<body>

  <div class="app">
    <div class="content center-content">
      <div class="menu-card">
        <h1 class="menu-title">Seçim edin</h1>

        <button class="menu-btn primary" onclick="goToQuestions()">
          Suallar
        </button>

        <button class="menu-btn secondary" onclick="goToConditions()">
          Məsələlər
        </button>

        <button class="menu-btn tertiary" onclick="goToOpenQuestions()">
          Açıq Suallar
        </button>

        <!-- Optional logout -->
        <button class="menu-btn danger" onclick="logout()">
          Çıxış
        </button>
      </div>
    </div>
  </div>

  <script>
    // 🔐 LOGIN PROTECTION
    const user = sessionStorage.getItem("loggedInUser");
    if (!user) {
      window.location.href = "index.html"; // login page
    }

    function logout() {
      sessionStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
    function goToQuestions() {
    window.location.href = "question.html";
    }

function goToConditions() {
  window.location.href = "condition.html";
}

function goToOpenQuestions() {
  window.location.href = "aciqsual.html";
}
  </script>

  <script src="./JavaScript/script0.js"></script>
</body>
</html>
