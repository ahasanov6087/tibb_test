<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Test Sisteminə Giriş</title>

    <link rel="stylesheet" href="./CSS/styles3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="login-box">

        <div class="header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <h1>Test Sisteminə Giriş</h1>
            </div>
            <p class="subtitle">Test və məsələlər üçün daxil olun</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Mail
                </label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-key"></i> Kod
                </label>
                <input type="password" id="password" required>
                <div class="password-toggle">
                    <i class="fas fa-eye" id="togglePassword"></i>
                </div>
            </div>

            <label class="checkbox">
                <input type="checkbox" id="remember">
                <span>Məlumatlarımı yadda saxla</span>
            </label>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Daxil Ol
            </button>
        </form>

        <div class="message" id="message"></div>

    </div>
</div>

<script src="./JavaScript/script4.js"></script>
</body>
</html>
