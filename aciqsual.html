<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sual-Cavab Tətbiqi</title>
    <link rel="stylesheet" href="./CSS/styles2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <div class="question-counter">Tibbi Açıq Suallar</div>
                <div class="progress-container">
                    <span class="progress-text"><i class="fas fa-chart-line"></i> İrəliləyiş</span>
                    <div class="progress">
                        <div class="progress-bar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </header>
        
        <main class="content">
            <div class="question-container">
                <div class="question-text" id="question-text">
                    <i class="fas fa-spinner fa-spin"></i> Sual yüklənir...
                </div>
                
                <div class="answers">
                    <!-- Answer area -->
                </div>
                
                <!-- CHANGED: Home Button instead of stats -->
                <div class="home-button-container">
                    <a href="index1.html" class="home-link-button">
                        <i class="fas fa-home"></i>
                        Ana Səhifəyə Qayıt
                    </a>
                </div>
                
                <div class="navigation-container">
                    <button class="nav-btn home" id="home-btn">
                        <i class="fas fa-random"></i>
                        Yeni Təsadüfi Sual
                    </button>
                    
                    <div class="nav-buttons">
                        <button class="nav-btn prev" id="prev-btn" disabled>
                            <i class="fas fa-arrow-left"></i>
                            Əvvəlki Sual
                        </button>
                        <button class="nav-btn next" id="next-btn">
                            <i class="fas fa-eye"></i>
                            Cavabı Göstər
                        </button>
                    </div>
                    
                    <!-- Only Total Stats -->
                    <div class="stats-container">
                        <div class="stat total-stat">
                            <span class="stat-value" id="total-count">0</span>
                            <span class="stat-label"><i class="fas fa-list-ol"></i> Cəmi Suallar</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- JavaScript Files -->
    <script src="./Data/cavab.js"></script>
    <script src="./JavaScript/script3.js"></script>
</body>
</html>
